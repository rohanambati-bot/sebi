services:
  - type: web
    name: sentinel-sebi
    env: node
    plan: free
    buildCommand: npm install && npm run train:all
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        value: sebi_admin_2026
